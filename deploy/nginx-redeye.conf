# Redeye: the site at redeye-agent.online and the agent at api.redeye-agent.online.
# certbot --nginx adds the TLS lines and the http-to-https redirect to both blocks.

server {
    listen 80;
    listen [::]:80;
    server_name redeye-agent.online www.redeye-agent.online;

    root /var/www/redeye;
    index index.html;

    # The site calls the agent under /api; the prefix is stripped on the way through.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Agent discovery on the site's own domain as well.
    location = /.well-known/agent-card.json { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /.well-known/agent-registration.json { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /a2a { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.redeye-agent.online;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
