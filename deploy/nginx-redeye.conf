# Redeye: the site at theredeyed-agent.site and the agent at api.theredeyed-agent.site.
# certbot --nginx adds the TLS lines and the http-to-https redirect to both blocks.

limit_req_zone $binary_remote_addr zone=redeye_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=redeye_passkey:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name theredeyed-agent.site www.theredeyed-agent.site;

    root /var/www/redeye;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # The site calls the agent under /api; the prefix is stripped on the way through.
    location /api/ {
        limit_req zone=redeye_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Agent discovery on the site's own domain as well.
    location = /.well-known/agent-card.json { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /.well-known/agent-registration.json { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }
    location = /a2a { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.theredeyed-agent.site;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /passkey/handoff {
        limit_req zone=redeye_passkey burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=redeye_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
